[project]
name = "room-13"
version = "1.0.0"
description = "Starter kit for the Room 13 project: text adventures (textquest), Tetris (tetris) and short videos."
authors = [
    {name = "Ferry Olthuis",email = "ferry.olthuis@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "blessed (>=1.23.0,<2.0.0)",
    "pygame-ce (>=2.5.8,<3.0.0)",
    "imageio-ffmpeg (>=0.6,<1.0)",
]

[tool.poetry]
packages = [{include = "textquest"}, {include = "tetris"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
